name: ci

# Validate every branch and PR: the scripts compile and the plugin runs clean.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Ruff (bug-focused rules, see ruff.toml)
        run: |
          pip install --quiet -r requirements-dev.txt
          ruff check burnbar.30s.py burnbar-statusline.py

  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the supported floor (oldest python3 burnbar targets); 3.x is the
        # current release — running both catches code that needs a newer runtime.
        python-version: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile
        run: python3 -m py_compile burnbar.30s.py burnbar-statusline.py

      - name: Tests
        # Pure-logic unit tests (stdlib unittest, no deps); run on every matrix leg.
        run: python3 -m unittest discover -s tests -v

      - name: Smoke run
        # No ~/.claude transcripts here, so the plugin takes its "set up" path;
        # we only assert it exits clean and prints a menu-bar line. Disable the
        # update check so the smoke test stays hermetic (no network).
        run: |
          mkdir -p ~/.config/burnbar
          echo '{"update_check":"off"}' > ~/.config/burnbar/config.json
          out=$(python3 burnbar.30s.py)
          echo "$out" | head -5
          test -n "$out"

      - name: Require version bump
        # Hard gate: if the plugin changed in a PR but <bitbar.version> didn't,
        # fail the check. The release only fires on a new version, so an unbumped
        # change would land on main and never ship — block the merge instead.
        # One matrix leg is enough; don't double-run on both pythons.
        if: github.event_name == 'pull_request' && matrix.python-version == '3.x'
        run: |
          ver() { grep -m1 -oE '<bitbar\.version>[0-9.]+' "$1" | sed 's/.*>//'; }
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --quiet "origin/${{ github.base_ref }}" -- burnbar.30s.py; then
            echo "burnbar.30s.py unchanged — no bump needed."
            exit 0
          fi
          base=$(git show "origin/${{ github.base_ref }}:burnbar.30s.py" | ver /dev/stdin || echo "")
          head=$(ver burnbar.30s.py)
          if [ "$head" = "$base" ]; then
            echo "::error::burnbar.30s.py changed but <bitbar.version> is still $head. Bump it before merging — the release only fires on a new version, so this change would never ship."
            exit 1
          fi
          echo "Version bump: $base -> $head."
